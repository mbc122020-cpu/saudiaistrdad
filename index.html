<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoVault SA - منصة USDT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #020818;
      --glass: rgba(255,255,255,0.05);
      --glass-border: rgba(255,255,255,0.1);
      --cyan: #00d4ff;
      --blue: #0066ff;
      --purple: #7c3aed;
      --gold: #f5a623;
      --green: #00e676;
      --red: #ff4444;
      --text: #fff;
      --text2: rgba(255,255,255,0.6);
      --text3: rgba(255,255,255,0.3);
      --grad: linear-gradient(135deg,#00d4ff,#0066ff,#7c3aed);
      --r: 16px;
      --t: all .3s cubic-bezier(.4,0,.2,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;direction:rtl}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 15%,rgba(0,212,255,.07) 0,transparent 50%),radial-gradient(ellipse at 85% 85%,rgba(124,58,237,.07) 0,transparent 50%);pointer-events:none;z-index:0}
    #root{position:relative;z-index:1}

    /* Scrollbar */
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--grad);border-radius:3px}

    /* Glass */
    .gc{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--r);transition:var(--t)}

    /* Buttons */
    .bp{background:var(--grad);color:#fff;border:none;padding:13px 28px;border-radius:50px;font-size:15px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;transition:var(--t);box-shadow:0 4px 20px rgba(0,212,255,.25);position:relative;overflow:hidden;letter-spacing:.3px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .bp:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,212,255,.4)}
    .bp:active{transform:translateY(0)}
    .bp:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .bp.full{width:100%}
    .bs{background:transparent;color:var(--cyan);border:1.5px solid var(--cyan);padding:12px 28px;border-radius:50px;font-size:15px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;transition:var(--t)}
    .bs:hover{background:rgba(0,212,255,.1)}
    .bsm{background:linear-gradient(135deg,#00e676,#00a152);color:#fff;border:none;padding:8px 18px;border-radius:50px;font-size:13px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;transition:var(--t)}
    .bdg{background:linear-gradient(135deg,#ff4444,#cc0000);color:#fff;border:none;padding:8px 18px;border-radius:50px;font-size:13px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;transition:var(--t)}
    .bwn{background:linear-gradient(135deg,#f5a623,#e67e00);color:#fff;border:none;padding:8px 18px;border-radius:50px;font-size:13px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;transition:var(--t)}

    /* Inputs */
    .fi{width:100%;background:rgba(255,255,255,.05);border:1.5px solid var(--glass-border);border-radius:10px;padding:13px 16px;color:#fff;font-size:15px;font-family:'Cairo',sans-serif;outline:none;transition:var(--t)}
    .fi::placeholder{color:var(--text3)}
    .fi:focus{border-color:var(--cyan);background:rgba(0,212,255,.05);box-shadow:0 0 0 3px rgba(0,212,255,.1)}
    .fl{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:7px}
    .fg{margin-bottom:18px}

    /* Badges */
    .bdp{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:50px;font-size:11px;font-weight:700}
    .bdp.pen{background:rgba(245,166,35,.15);color:var(--gold);border:1px solid rgba(245,166,35,.3)}
    .bdp.com{background:rgba(0,230,118,.15);color:var(--green);border:1px solid rgba(0,230,118,.3)}
    .bdp.can{background:rgba(255,68,68,.15);color:var(--red);border:1px solid rgba(255,68,68,.3)}

    /* Alert */
    .al{padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .al.err{background:rgba(255,68,68,.12);border:1px solid rgba(255,68,68,.3);color:#ff6b6b}
    .al.suc{background:rgba(0,230,118,.12);border:1px solid rgba(0,230,118,.3);color:var(--green)}
    .al.inf{background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.3);color:var(--cyan)}

    /* Spinner */
    .sp{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Animations */
    @keyframes fiu{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fi{from{opacity:0}to{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
    @keyframes glow{0%,100%{box-shadow:0 0 20px rgba(0,212,255,.2)}50%{box-shadow:0 0 40px rgba(0,212,255,.5)}}
    .afu{animation:fiu .6s ease both}
    .hidden{display:none!important}

    /* ===================== PAGES ===================== */

    /* HOME */
    .home{min-height:100vh}
    .hnav{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:1100px;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;z-index:100;border-radius:50px}
    .hlogo{display:flex;align-items:center;gap:10px}
    .hli{width:38px;height:38px;background:var(--grad);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900}
    .hlt{font-size:19px;font-weight:900;letter-spacing:-.5px}
    .hla{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .hnl{display:flex;gap:10px;align-items:center}

    .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:140px 24px 60px}
    .hbadge{display:inline-flex;align-items:center;gap:8px;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.2);color:var(--cyan);padding:7px 18px;border-radius:50px;font-size:13px;font-weight:700;margin-bottom:24px}
    .bdot{width:7px;height:7px;background:var(--cyan);border-radius:50%;animation:pulse 2s infinite}
    .htitle{font-size:clamp(38px,7vw,74px);font-weight:900;line-height:1.15;letter-spacing:-2px;margin-bottom:20px}
    .gtext{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .hsub{font-size:17px;color:var(--text2);max-width:480px;line-height:1.8;margin-bottom:36px}
    .hacts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:60px}

    /* Floating USDT Card */
    .fcard{animation:float 4s ease-in-out infinite;margin-top:20px}
    .fci{padding:22px 26px;min-width:290px;background:linear-gradient(145deg,rgba(0,212,255,.08),rgba(0,102,255,.04));border-color:rgba(0,212,255,.2)}
    .fch{display:flex;align-items:center;gap:11px;margin-bottom:18px}
    .usdti{width:42px;height:42px;background:linear-gradient(135deg,#26a17b,#1a7a5a);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;color:#fff}
    .fct{font-size:14px;font-weight:700}
    .fcs{font-size:11px;color:var(--text3)}
    .fclive{margin-right:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);background:rgba(0,230,118,.1);padding:4px 10px;border-radius:50px}
    .ldot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 1.5s infinite}
    .fcp{font-size:34px;font-weight:900;letter-spacing:-1px}
    .fcch{font-size:12px;color:var(--green);margin:4px 0 14px}
    .fcbar{height:4px;background:rgba(255,255,255,.08);border-radius:2px}
    .fcbf{height:100%;background:var(--grad);border-radius:2px;width:72%}

    /* Stats */
    .stats{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;padding:0 24px 70px}
    .stc{text-align:center;padding:28px 44px}
    .stv{font-size:38px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:5px}
    .stl{font-size:13px;color:var(--text2)}

    /* Features */
    .feats{padding:60px 24px;max-width:1100px;margin:0 auto}
    .stitle{text-align:center;font-size:clamp(26px,4vw,40px);font-weight:900;margin-bottom:50px;letter-spacing:-1px}
    .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
    .fitem{padding:28px 24px}
    .fico{font-size:34px;margin-bottom:14px}
    .fitl{font-size:17px;font-weight:800;margin-bottom:8px}
    .fidc{font-size:13px;color:var(--text2);line-height:1.7}

    /* CTA */
    .cta{padding:50px 24px 70px}
    .ctac{max-width:650px;margin:0 auto;text-align:center;padding:50px 36px;background:linear-gradient(145deg,rgba(0,212,255,.08),rgba(0,102,255,.04));border-color:rgba(0,212,255,.25);animation:glow 3s infinite}
    .ctat{font-size:28px;font-weight:900;margin-bottom:10px}
    .ctab{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.7}

    /* Footer */
    .hfoot{text-align:center;padding:30px 24px;border-top:1px solid var(--glass-border)}
    .hfl{font-size:20px;font-weight:900;margin-bottom:6px}
    .hft{color:var(--text2);font-size:13px;margin-bottom:6px}
    .hfc{color:var(--text3);font-size:11px}

    /* ===================== AUTH ===================== */
    .apage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
    .aorb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
    .ao1{width:450px;height:450px;background:radial-gradient(circle,rgba(0,212,255,.1),transparent 70%);top:-100px;right:-100px;animation:float 8s infinite}
    .ao2{width:380px;height:380px;background:radial-gradient(circle,rgba(124,58,237,.1),transparent 70%);bottom:-80px;left:-80px;animation:float 10s .5s infinite reverse}
    .acont{position:relative;z-index:1;width:100%;max-width:480px}
    .acont.wide{max-width:700px}
    .alogo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px;text-decoration:none;color:#fff;cursor:pointer}
    .alogo span{font-size:22px;font-weight:900}
    .acard{padding:36px 32px}
    .atit{font-size:26px;font-weight:900;margin-bottom:6px}
    .asub{font-size:14px;color:var(--text2);margin-bottom:24px}
    .asbtn{width:100%;padding:15px;font-size:16px;margin-top:4px}
    .asw{text-align:center;margin-top:20px;font-size:14px;color:var(--text2)}
    .alink{color:var(--cyan);font-weight:700;cursor:pointer;text-decoration:none}
    .alink:hover{text-decoration:underline}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:500px){.frow{grid-template-columns:1fr}}

    /* ===================== DASHBOARD ===================== */
    .dash{min-height:100vh;display:flex}
    .dsb{width:260px;min-height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:8px;position:fixed;top:0;right:0;border-left:1px solid var(--glass-border);background:rgba(2,8,24,.95);backdrop-filter:blur(20px);z-index:50;transition:var(--t)}
    .dsblogo{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:12px}
    .dsbi{width:36px;height:36px;background:var(--grad);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900}
    .dsbt{font-size:17px;font-weight:900}
    .dsbnav{display:flex;flex-direction:column;gap:4px;flex:1}
    .dsbitem{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text2);transition:var(--t);border:1px solid transparent}
    .dsbitem:hover{color:#fff;background:var(--glass)}
    .dsbitem.act{color:#fff;background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.2)}
    .dsbitem .ico{font-size:18px;min-width:20px;text-align:center}
    .dsbout{margin-top:auto}

    .dmain{margin-right:260px;flex:1;padding:32px 28px;min-height:100vh}
    .dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
    .dhtit{font-size:22px;font-weight:900}
    .dhsub{font-size:13px;color:var(--text2)}
    .dhbadge{display:flex;align-items:center;gap:8px;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.2);padding:8px 16px;border-radius:50px;font-size:13px;font-weight:600;color:var(--cyan)}

    /* Balance Card */
    .balcard{background:linear-gradient(145deg,rgba(0,212,255,.12),rgba(0,102,255,.08),rgba(124,58,237,.06));border:1px solid rgba(0,212,255,.25);border-radius:20px;padding:32px;margin-bottom:28px;animation:glow 4s infinite}
    .bcht{font-size:13px;color:var(--text2);margin-bottom:8px}
    .bcval{font-size:52px;font-weight:900;letter-spacing:-2px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
    .bcusdt{font-size:15px;color:var(--text2);margin-bottom:20px}
    .bcinfo{display:flex;gap:24px;flex-wrap:wrap}
    .bci{font-size:13px;color:var(--text2)}
    .bci strong{color:#fff;display:block;font-size:14px;margin-bottom:2px}
    .bcacts{display:flex;gap:12px;margin-top:20px}

    /* Stat Cards */
    .statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
    .statc{padding:22px;display:flex;align-items:center;gap:16px}
    .stati{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
    .stattext .sv{font-size:24px;font-weight:900;letter-spacing:-.5px}
    .stattext .sl{font-size:12px;color:var(--text2);margin-top:2px}

    /* Transactions Table */
    .ttbl{width:100%;border-collapse:collapse;font-size:14px}
    .ttbl th{padding:12px 16px;text-align:right;color:var(--text2);font-size:12px;font-weight:700;border-bottom:1px solid var(--glass-border);letter-spacing:.5px}
    .ttbl td{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04)}
    .ttbl tr:hover td{background:rgba(255,255,255,.02)}
    .ttbl .ttype{display:flex;align-items:center;gap:6px;font-weight:600}
    .tamt.dep{color:var(--green)}
    .tamt.wd{color:var(--red)}
    .tcopy{background:rgba(255,255,255,.06);border:none;color:var(--text2);padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:'Cairo',sans-serif;transition:var(--t)}
    .tcopy:hover{color:#fff;background:rgba(255,255,255,.12)}

    /* Deposit Page */
    .depcont{max-width:620px}
    .qrbox{padding:28px;text-align:center;margin-bottom:20px}
    .qrsvg{width:180px;height:180px;background:#fff;border-radius:12px;padding:10px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
    .wallet{font-size:12px;color:var(--text2);word-break:break-all;padding:12px 16px;background:rgba(255,255,255,.04);border-radius:8px;border:1px solid var(--glass-border);margin-bottom:10px;font-family:monospace;direction:ltr;text-align:center;line-height:1.6}
    .copyw{width:100%;padding:10px;font-size:13px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);color:var(--cyan);border-radius:8px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;transition:var(--t)}
    .copyw:hover{background:rgba(0,212,255,.15)}
    .warns{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.25);border-radius:10px;padding:14px 16px;margin-bottom:20px;font-size:13px;color:var(--gold);line-height:1.7}

    /* Withdraw Page */
    .wdcont{max-width:520px}

    /* Profile */
    .profcard{padding:28px;max-width:560px}
    .pfhd{display:flex;align-items:center;gap:20px;margin-bottom:28px}
    .pfav{width:72px;height:72px;background:var(--grad);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;box-shadow:0 0 30px rgba(0,212,255,.3)}
    .pfname{font-size:22px;font-weight:900;margin-bottom:4px}
    .pfemail{font-size:13px;color:var(--text2)}
    .pfrows{display:flex;flex-direction:column;gap:14px}
    .pfrow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(255,255,255,.04);border-radius:10px;border:1px solid var(--glass-border)}
    .pfrl{font-size:12px;color:var(--text2);margin-bottom:3px}
    .pfrv{font-size:15px;font-weight:700}

    /* ===================== ADMIN ===================== */
    .admpage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
    .admo{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
    .admo1{width:500px;height:500px;background:radial-gradient(circle,rgba(124,58,237,.1),transparent 70%);top:-150px;left:-150px;animation:float 9s infinite}
    .admo2{width:400px;height:400px;background:radial-gradient(circle,rgba(245,166,35,.08),transparent 70%);bottom:-100px;right:-100px;animation:float 11s .5s infinite reverse}
    .admcont{position:relative;z-index:1;width:100%;max-width:460px}
    .admcard{padding:40px 36px;text-align:center}
    .admico{width:70px;height:70px;background:linear-gradient(135deg,#7c3aed,#4c1d95);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 20px;box-shadow:0 0 30px rgba(124,58,237,.4);animation:glow 3s infinite}
    .admtit{font-size:26px;font-weight:900;margin-bottom:6px}
    .admsub{font-size:13px;color:var(--text2);margin-bottom:28px}

    /* Admin Panel */
    .admpanel{min-height:100vh;padding:28px 24px;max-width:1200px;margin:0 auto}
    .admhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:gap}
    .admhtit{font-size:24px;font-weight:900}
    .admtabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
    .admtab{padding:10px 20px;border-radius:50px;border:1px solid var(--glass-border);background:transparent;color:var(--text2);font-family:'Cairo',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:var(--t)}
    .admtab.act{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.3);color:var(--cyan)}

    /* Table responsive */
    .tscroll{overflow-x:auto;border-radius:var(--r)}
    .user-row{cursor:pointer}
    .user-row:hover td{background:rgba(0,212,255,.04)}

    /* Mobile Sidebar Toggle */
    .sbtog{display:none;position:fixed;top:16px;left:16px;z-index:200;background:var(--glass);border:1px solid var(--glass-border);color:#fff;width:42px;height:42px;border-radius:10px;font-size:20px;cursor:pointer;align-items:center;justify-content:center;backdrop-filter:blur(10px)}

    @media(max-width:900px){
      .dsb{transform:translateX(100%)}
      .dsb.open{transform:translateX(0)}
      .dmain{margin-right:0;padding:24px 16px}
      .sbtog{display:flex}
      .dhead{flex-direction:column;align-items:flex-start;gap:12px;padding-top:50px}
    }
    @media(max-width:600px){
      .fcard{min-width:unset;width:100%;max-width:320px}
      .bcacts{flex-direction:column}
      .bcval{font-size:38px}
      .hnav{width:calc(100% - 24px);top:10px;padding:12px 16px}
      .hnl .bs{display:none}
      .frow{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Firebase -->
<script type="module">
// ============================================================
// FIREBASE - Initialized from config
// ============================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

// FIREBASE SERVICES
// ============================================================
async function registerUser(name, idNumber, email, password) {
  const cred = await createUserWithEmailAndPassword(auth, email, password);
  await updateProfile(cred.user, { displayName: name });
  await setDoc(doc(db, 'users', cred.user.uid), {
    name, email, idNumber, balance: 0,
    createdAt: serverTimestamp(), uid: cred.user.uid
  });
  return cred.user;
}

async function loginUser(email, password) {
  return (await signInWithEmailAndPassword(auth, email, password)).user;
}

async function getUserData(uid) {
  const s = await getDoc(doc(db, 'users', uid));
  return s.exists() ? s.data() : null;
}

async function getUserTransactions(uid) {
  const q = query(collection(db, 'transactions'), where('uid', '==', uid), orderBy('createdAt', 'desc'));
  const s = await getDocs(q);
  return s.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function createDeposit(uid, amount, txHash) {
  return addDoc(collection(db, 'transactions'), {
    uid, type: 'deposit', amount: parseFloat(amount),
    txHash: txHash || '', status: 'pending', createdAt: serverTimestamp()
  });
}

async function createWithdraw(uid, amount, walletAddr) {
  const bal = userData?.balance || 0;
  if (parseFloat(amount) > bal) throw new Error('رصيدك غير كافٍ');
  return addDoc(collection(db, 'transactions'), {
    uid, type: 'withdraw', amount: parseFloat(amount),
    walletAddress: walletAddr, status: 'pending', createdAt: serverTimestamp()
  });
}

async function getAllUsers() {
  const s = await getDocs(collection(db, 'users'));
  return s.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function getAllTransactions() {
  const q = query(collection(db, 'transactions'), orderBy('createdAt', 'desc'));
  const s = await getDocs(q);
  return s.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function updateTxStatus(id, status, uid, amount, type) {
  await updateDoc(doc(db, 'transactions', id), { status, updatedAt: serverTimestamp() });
  if (status === 'completed') {
    const u = await getUserData(uid);
    const bal = u?.balance || 0;
    const newBal = type === 'deposit' ? bal + parseFloat(amount) : Math.max(0, bal - parseFloat(amount));
    await updateDoc(doc(db, 'users', uid), { balance: newBal });
  }
}

async function addBalanceToUser(uid, amount) {
  const u = await getUserData(uid);
  const newBal = (u?.balance || 0) + parseFloat(amount);
  await updateDoc(doc(db, 'users', uid), { balance: newBal });
}

function verifyAdmin(pw) {
  const h = (s => { let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h)+s.charCodeAt(i); return (h>>>0).toString(16); })(pw);
  return h === _AH;
}

// AUTH LISTENER
// ============================================================
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user) {
    userData = await getUserData(user.uid);
    if (currentPage === 'home' || currentPage === 'login' || currentPage === 'register') {
      navigate('dashboard');
    }
  } else {
    userData = null;
  }
});

function render(page, params) {
  const root = document.getElementById('root');
  root.innerHTML = '';
  const pages = {
    home: renderHome,
    login: renderLogin,
    register: renderRegister,
    dashboard: renderDashboard,
    'dash-deposit': () => renderDashboard('deposit'),
    'dash-withdraw': () => renderDashboard('withdraw'),
    'dash-transactions': () => renderDashboard('transactions'),
    'dash-profile': () => renderDashboard('profile'),
    'system-login': renderSystemLogin,
    'system-panel': renderSystemPanel,
  };
  const fn = pages[page];
  if (fn) fn(params);
  else renderHome();
}

// FORMAT HELPERS

function fmtDate(ts) {
  if (!ts) return '-';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('ar-SA', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtBal(n) { return (parseFloat(n || 0)).toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function txTypeName(t) { return t === 'deposit' ? '📥 إيداع' : '📤 سحب'; }
function statusBadge(s) {
  const map = { pending: ['pen','⏳','قيد التنفيذ'], completed: ['com','✅','مكتمل'], cancelled: ['can','❌','ملغي'] };
  const [cls, ico, lbl] = map[s] || ['pen','⏳','غير معروف'];
  return `<span class="bdp ${cls}">${ico} ${lbl}</span>`;
}

async function doLogin() {
  const email = document.getElementById('lemail').value.trim();
  const pw = document.getElementById('lpw').value;
  const al = document.getElementById('al');
  const btn = document.getElementById('lbtn');
  al.innerHTML = '';
  if (!email || !pw) { al.innerHTML = `<div class="al err">⚠️ يرجى إدخال البيانات</div>`; return; }
  btn.disabled = true; btn.innerHTML = `<span class="sp"></span>`;
  try {
    await loginUser(email, pw);
    navigate('dashboard');
  } catch(e) {
    const msgs = { 'auth/invalid-credential':'البريد أو كلمة السر غير صحيحة','auth/user-not-found':'البريد أو كلمة السر غير صحيحة','auth/wrong-password':'البريد أو كلمة السر غير صحيحة','auth/too-many-requests':'تجاوزت عدد المحاولات، حاول لاحقاً' };
    al.innerHTML = `<div class="al err">⚠️ ${msgs[e.code] || 'خطأ في الاتصال'}</div>`;
    btn.disabled = false; btn.innerHTML = 'تسجيل الدخول';
  }
}

  const pw = document.getElementById('rpw').value;

  if (!name||!id||!email||!pw) { al.innerHTML=`<div class="al err">⚠️ يرجى تعبئة جميع الحقول</div>`; return; }

  if (pw.length < 8) { al.innerHTML=`<div class="al err">⚠️ كلمة السر يجب أن تكون 8 أحرف على الأقل</div>`; return; }

  try {
    await registerUser(name, id, email, pw);
    navigate('dashboard');
  } catch(e) {
    const msgs = { 'auth/email-already-in-use':'هذا البريد مسجل بالفعل','auth/weak-password':'كلمة السر ضعيفة جداً','auth/invalid-email':'البريد الإلكتروني غير صالح' };

    btn.disabled=false; btn.innerHTML='إنشاء الحساب';
  }
}

  const el = document.getElementById('admbody');
  el.innerHTML = `<div class="gc tscroll"><table class="ttbl">
    <thead><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>رقم الهوية</th><th>الرصيد</th><th>إضافة رصيد</th></tr></thead>
    <tbody>${_adminUsers.map(u=>`
      <tr>
        <td style="font-weight:700">${u.name||'-'}</td>
        <td style="font-size:13px;color:var(--text2)">${u.email||'-'}</td>
        <td style="font-size:13px;color:var(--text2)">${u.idNumber||'-'}</td>
        <td class="tamt dep">${fmtBal(u.balance)} USDT</td>
        <td>
          <div style="display:flex;gap:6px;align-items:center">
            <input class="fi" id="badd-${u.id}" type="number" placeholder="المبلغ" min="1" style="width:100px;padding:7px 10px;font-size:13px" />
            <button class="bsm" onclick="doAddBalance('${u.id}')">إضافة</button>
          </div>
        </td>
      </tr>`).join('')}
    </tbody></table></div>`;
}

async function doAddBalance(uid) {
  const inp = document.getElementById('badd-'+uid);
  const amt = parseFloat(inp?.value);
  if (!amt || amt <= 0) { alert('أدخل مبلغاً صحيحاً'); return; }
  if (!confirm(`إضافة ${amt} USDT لهذا المستخدم؟`)) return;
  try {
    await addBalanceToUser(uid, amt);
    inp.value = '';
    await loadAdminData();
    alert('✅ تمت إضافة الرصيد بنجاح');
  } catch(e) { alert('خطأ: ' + e.message); }
}

window.navigate = navigate;
window.doLogin = doLogin;
window.doRegister = doRegister;
window.doLogout = doLogout;
window.renderDashboard = renderDashboard;
window.toggleSidebar = toggleSidebar;
window.closeSidebar = closeSidebar;
window.copyWallet = copyWallet;
window.submitDeposit = submitDeposit;
window.submitWithdraw = submitWithdraw;
window.renderDTransactions = renderDTransactions;
window.filterTx = filterTx;
window.doAdminLogin = doAdminLogin;
window.doUpdateTx = doUpdateTx;
window.doAddBalance = doAddBalance;
window.showAdminTab = showAdminTab;
window.filterAdminTx = filterAdminTx;

// Init router from URL hash
function initRoute() {
  const h = window.location.hash.replace('#','') || 'home';
  if (h === 'system-login') { navigate('system-login'); return; }
  if (currentUser) navigate('dashboard');
  else navigate(h);
}

window.addEventListener('hashchange', () => {
  const h = window.location.hash.replace('#','') || 'home';
  if (h === 'system-login') navigate('system-login');
});

// Start
renderHome();
setTimeout(() => {
  if (!currentUser && !['login','register','system-login'].includes(window.location.hash.replace('#',''))) {
    navigate('home');
  }
}, 100);

</script>
